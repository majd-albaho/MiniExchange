syntax = "proto3";

option csharp_namespace = "TradingService.Api.Protos";

package trading_pair;

service TradingPairGrpc {
  rpc GetOrderById (OrderByIdGrpcRequest) returns (OrderGrpcResponse);
  rpc CreateOrder (CreateOrderGrpcRequest) returns (OrderGrpcResponse);
  rpc RemoveOrder (OrderByIdGrpcRequest) returns (RemoveOrderGrpcResponse);
}

enum OrderSideGrpc {
  ORDER_SIDE_UNSPECIFIED = 0;
  ORDER_SIDE_BUY = 1;
  ORDER_SIDE_SELL = 2;
}

enum OrderTypeGrpc {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_MARKET = 1;
  ORDER_TYPE_LIMIT = 2;
}

enum OrderStatusGrpc {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_FILLED = 2;
  ORDER_STATUS_PARTIALLY_FILLED = 3;
  ORDER_STATUS_CANCELED = 4;
  ORDER_STATUS_REJECTED = 5;
}

message OrderByIdGrpcRequest {
  string id = 1;
}

message CreateOrderGrpcRequest {
  string user_id = 1;
  string pair_symbol = 2;
  OrderSideGrpc side = 3;
  OrderTypeGrpc type = 4;
  string price = 5;
  string quantity = 6;
  string created_by = 7;
}

message OrderGrpcResponse {
  string id = 1;
  string user_id = 2;
  string pair_symbol = 3;
  OrderSideGrpc side = 4;
  OrderTypeGrpc type = 5;
  string price = 6;
  string quantity = 7;
  string filled_quantity = 8;
  OrderStatusGrpc status = 9;
  string created_date = 10;
  string modified_date = 11;
}

message RemoveOrderGrpcResponse {
  bool removed = 1;
}
<div class="stat-card">
  <div class="stat-label">{{ label }}</div>
  <div class="stat-value">{{ value }}</div>
  @if (change !== undefined) {
    <div class="stat-change" [class.up]="change >= 0" [class.down]="change < 0">
      {{ change >= 0 ? '+' : '' }}{{ change | number:'1.2-2' }}%
    </div>
  }
</div>
